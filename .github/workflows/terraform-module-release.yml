name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-version:
        description: 'Force specific version (leave empty for auto versioning)'
        required: false
        type: string

jobs:
  terraform-module-release:
    name: Release Terraform Module
    uses: proscia-techops/github-actions-workflows/.github/workflows/terraform-module-release.yml@main
    with:
      force-version: ${{ inputs.force-version || '' }}
